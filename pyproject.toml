[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "escape-de-la-torre"
version = "1.0.0"
description = "Simulador multiagente de evacuacion con busqueda y algoritmo genetico"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
cuda = ["torch>=2.0"]

[project.scripts]
torre-benchmark = "torre.benchmark:main"
torre-report = "torre.reporting:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
